spring:
  application:
    name: condominio-gestao
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

app:
  upload:
    dir: ${user.home}/condominio-uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.condominio: DEBUG
