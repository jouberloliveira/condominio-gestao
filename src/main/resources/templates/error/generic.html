<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Erro Interno</title></head>
<body>
<div layout:fragment="content" class="container mx-auto p-6">
  <div class="bg-gray-50 border border-gray-300 rounded-lg p-6 max-w-lg mx-auto">
    <h2 class="text-xl font-bold text-gray-700 mb-2" th:text="${errorTitle}">Erro</h2>
    <p class="text-gray-600" th:text="${errorMessage}">Ocorreu um erro inesperado.</p>
    <a href="/dashboard" class="mt-4 inline-block text-blue-600 hover:underline">← Ir para Dashboard</a>
  </div>
</div>
</body>
</html>
