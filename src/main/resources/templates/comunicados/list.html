<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::content})}"
      lang="pt-BR">
<th:block th:fragment="content">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
            <h2 class="text-xl font-bold text-gray-800">Quadro de Comunicados</h2>
            <p class="text-sm text-gray-500 mt-0.5">Avisos e informações para os moradores</p>
        </div>
        <a th:href="@{/comunicados/new}"
           sec:authorize="hasRole('ADMIN')"
           class="inline-flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Novo Comunicado
        </a>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(comunicados)}"
         class="flex flex-col items-center justify-center py-16 bg-white rounded-xl border border-gray-200 shadow-sm">
        <div class="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center mb-4">
            <svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
            </svg>
        </div>
        <p class="text-sm font-medium text-gray-700 mb-1">Nenhum comunicado publicado</p>
        <p class="text-xs text-gray-400">Os comunicados aparecerão aqui quando forem publicados.</p>
    </div>

    <!-- Bulletin board -->
    <div th:unless="${#lists.isEmpty(comunicados)}" class="space-y-4">
        <div th:each="com : ${comunicados}"
             class="bg-white rounded-xl border shadow-sm overflow-hidden transition-shadow hover:shadow-md"
             th:classappend="${com.tipo?.name() == 'URGENTE'} ? 'border-red-200' : 'border-gray-200'">

            <!-- Urgente top bar -->
            <div th:if="${com.tipo?.name() == 'URGENTE'}"
                 class="bg-red-500 px-4 py-1 flex items-center gap-2">
                <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span class="text-xs font-bold text-white uppercase tracking-wide">Urgente</span>
            </div>

            <div class="p-5">
                <div class="flex items-start justify-between gap-4">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            <span th:class="${com.tipo?.name() == 'URGENTE'} ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800' :
                                            (${com.tipo?.name() == 'AVISO'} ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800' :
                                            (${com.tipo?.name() == 'FINANCEIRO'} ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800' :
                                            (${com.tipo?.name() == 'MANUTENCAO'} ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-800' :
                                            'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800')))"
                                  th:text="${com.tipo}">—</span>
                        </div>
                        <h3 class="text-base font-semibold text-gray-800 mb-2" th:text="${com.titulo}">Título</h3>
                        <p class="text-sm text-gray-600 whitespace-pre-line" th:text="${com.corpo}">Conteúdo</p>
                    </div>

                    <div sec:authorize="hasRole('ADMIN')" class="flex items-center gap-2 flex-shrink-0">
                        <a th:href="@{/comunicados/{id}/edit(id=${com.id})}"
                           class="p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                        </a>
                        <a th:href="@{/comunicados/{id}/delete(id=${com.id})}"
                           onclick="return confirm('Deseja remover este comunicado?')"
                           class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </a>
                    </div>
                </div>

                <div class="flex items-center gap-3 mt-4 pt-3 border-t border-gray-100">
                    <span class="text-xs text-gray-400">
                        Por <span class="font-medium text-gray-500" th:text="${com.autor}">Administrador</span>
                    </span>
                    <span class="text-gray-300">·</span>
                    <span class="text-xs text-gray-400"
                          th:text="${#temporals.format(com.publicadoEm, 'dd/MM/yyyy HH:mm')}">—</span>
                </div>
            </div>
        </div>
    </div>

</th:block>
</html>
