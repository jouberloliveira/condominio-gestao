<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}"
      lang="pt-BR">
<th:block th:fragment="content">

    <div class="mb-6">
        <nav class="flex items-center gap-2 text-sm text-gray-500 mb-3">
            <a th:href="@{/comunicados}" class="hover:text-blue-600">Comunicados</a>
            <span>/</span>
            <span class="text-gray-800 font-medium" th:text="${comunicado.id == null} ? 'Novo' : 'Editar'">Novo</span>
        </nav>
        <h2 class="text-xl font-bold text-gray-800"
            th:text="${comunicado.id == null} ? 'Novo Comunicado' : 'Editar Comunicado'">Comunicado</h2>
    </div>

    <div class="max-w-2xl">
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
            <form th:action="@{/comunicados}" th:object="${comunicado}" method="post" novalidate>
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:if="${comunicado.id != null}" th:field="*{autor}"/>
                <input type="hidden" th:if="${comunicado.id != null}" th:field="*{publicadoEm}"/>

                <div class="space-y-5">

                    <div>
                        <label for="titulo" class="block text-sm font-medium text-gray-700 mb-1.5">Título *</label>
                        <input id="titulo" type="text" th:field="*{titulo}"
                               placeholder="Título do comunicado"
                               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               required/>
                        <p th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"
                           class="mt-1 text-xs text-red-600"></p>
                    </div>

                    <div>
                        <label for="tipo" class="block text-sm font-medium text-gray-700 mb-1.5">Tipo *</label>
                        <div class="flex flex-wrap gap-2">
                            <label th:each="t : ${tipos}"
                                   class="flex items-center gap-2 px-4 py-2 rounded-lg border cursor-pointer text-sm font-medium transition-colors"
                                   th:classappend="${comunicado.tipo == t} ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-gray-200 text-gray-600 hover:border-gray-300'">
                                <input type="radio" th:field="*{tipo}" th:value="${t}"
                                       class="sr-only"/>
                                <span th:text="${t}">TIPO</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label for="corpo" class="block text-sm font-medium text-gray-700 mb-1.5">Conteúdo *</label>
                        <textarea id="corpo" th:field="*{corpo}" rows="6"
                                  placeholder="Escreva o conteúdo do comunicado..."
                                  class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-y"
                                  required></textarea>
                        <p th:if="${#fields.hasErrors('corpo')}" th:errors="*{corpo}"
                           class="mt-1 text-xs text-red-600"></p>
                    </div>

                    <div>
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" th:field="*{ativo}"
                                   class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"/>
                            <span class="text-sm font-medium text-gray-700">Publicar imediatamente</span>
                        </label>
                    </div>

                </div>

                <div class="flex items-center gap-3 mt-7 pt-5 border-t border-gray-100">
                    <button type="submit"
                            class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Publicar Comunicado
                    </button>
                    <a th:href="@{/comunicados}"
                       class="px-5 py-2.5 bg-white hover:bg-gray-50 text-gray-700 text-sm font-medium rounded-lg border border-gray-300 transition-colors">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.querySelectorAll('input[type=radio][name=tipo]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.querySelectorAll('label').forEach(l => {
                    const r = l.querySelector('input[type=radio]');
                    if (!r) return;
                    if (r.checked) {
                        l.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                        l.classList.remove('border-gray-200', 'text-gray-600');
                    } else {
                        l.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                        l.classList.add('border-gray-200', 'text-gray-600');
                    }
                });
            });
        });
    </script>

</th:block>
</html>
