<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<head><title>Unidades</title></head>
<body>
    <div th:fragment="content">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold">Unidades</h2>
            <a href="/unidades/new" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Nova Unidade</a>
        </div>
        <div class="bg-white shadow-md rounded overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="px-6 py-3 text-left">Identificação</th>
                        <th class="px-6 py-3 text-left">Bloco</th>
                        <th class="px-6 py-3 text-left">Número</th>
                        <th class="px-6 py-3 text-left">Andar</th>
                        <th class="px-6 py-3 text-left">Vaga Garagem</th>
                        <th class="px-6 py-3 text-left">Situação</th>
                        <th class="px-6 py-3 text-left">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="unidade : ${unidades}" class="border-b hover:bg-gray-50">
                        <td class="px-6 py-4" th:text="${unidade.identificacao}"></td>
                        <td class="px-6 py-4" th:text="${unidade.bloco}"></td>
                        <td class="px-6 py-4" th:text="${unidade.numero}"></td>
                        <td class="px-6 py-4" th:text="${unidade.andar}"></td>
                        <td class="px-6 py-4" th:text="${unidade.vagaGaragem}"></td>
                        <td class="px-6 py-4" th:text="${unidade.situacao}"></td>
                        <td class="px-6 py-4">
                            <a th:href="@{/unidades/edit/{id}(id=${unidade.id})}" class="text-blue-600 hover:underline mr-2">Editar</a>
                            <a th:href="@{/unidades/delete/{id}(id=${unidade.id})}" class="text-red-600 hover:underline" 
                               onclick="return confirm('Confirma exclusão?')">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
