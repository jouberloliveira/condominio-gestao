<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::content})}"
      lang="pt-BR">
<th:block th:fragment="content">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
            <h2 class="text-xl font-bold text-gray-800">Unidades</h2>
            <p class="text-sm text-gray-500 mt-0.5">Gestão de unidades do condomínio</p>
        </div>
        <a th:href="@{/unidades/new}"
           sec:authorize="hasRole('ADMIN')"
           class="inline-flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Nova Unidade
        </a>
    </div>

    <div class="mb-4">
        <input id="search" type="text" placeholder="Buscar por identificação, bloco ou número..."
               oninput="filterTable()"
               class="w-full sm:w-80 px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-100" id="unidades-table">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Identificação</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Bloco</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Número</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Andar</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Vaga</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Situação</th>
                        <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Ações</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:if="${#lists.isEmpty(unidades)}">
                        <td colspan="7" class="px-6 py-12 text-center text-sm text-gray-400">
                            Nenhuma unidade cadastrada.
                        </td>
                    </tr>
                    <tr th:each="unidade : ${unidades}" class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4">
                            <span class="text-sm font-semibold text-gray-800" th:text="${unidade.identificacao}">—</span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-600" th:text="${unidade.bloco}">—</td>
                        <td class="px-6 py-4 text-sm text-gray-600" th:text="${unidade.numero}">—</td>
                        <td class="px-6 py-4 text-sm text-gray-600" th:text="${unidade.andar} ?: '—'">—</td>
                        <td class="px-6 py-4 text-sm text-gray-600" th:text="${unidade.vaga} ?: '—'">—</td>
                        <td class="px-6 py-4">
                            <span th:class="${unidade.situacao?.name() == 'OCUPADA'} ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800' : (${unidade.situacao?.name() == 'VAGA'} ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800' : 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-700')"
                                  th:text="${unidade.situacao}">—</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <a th:href="@{/unidades/{id}/edit(id=${unidade.id})}"
                                   sec:authorize="hasRole('ADMIN')"
                                   class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors">
                                    Editar
                                </a>
                                <a th:href="@{/unidades/{id}/delete(id=${unidade.id})}"
                                   sec:authorize="hasRole('ADMIN')"
                                   onclick="return confirm('Deseja excluir esta unidade?')"
                                   class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-red-700 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">
                                    Excluir
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="px-6 py-3 bg-gray-50 border-t border-gray-100 text-xs text-gray-500"
             th:text="${#lists.size(unidades)} + ' unidade(s) cadastrada(s)'"></div>
    </div>

    <script>
        function filterTable() {
            const q = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('#unidades-table tbody tr[class]').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }
    </script>

</th:block>
</html>
