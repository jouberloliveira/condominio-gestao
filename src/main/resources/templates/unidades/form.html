<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head><title>Unidade</title></head>
<body>
<div th:fragment="content">

  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800" th:text="${unidade.id == null} ? 'Nova Unidade' : 'Editar Unidade'">Unidade</h1>
  </div>

  <div class="card p-6 max-w-2xl">
    <form th:action="@{/unidades}" th:object="${unidade}" method="post" class="space-y-5">
      <input type="hidden" th:field="*{id}">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="form-label">Bloco <span class="text-red-500">*</span></label>
          <input type="text" th:field="*{bloco}" class="form-input" required placeholder="Ex: A">
          <span th:if="${#fields.hasErrors('bloco')}" th:errors="*{bloco}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Número <span class="text-red-500">*</span></label>
          <input type="text" th:field="*{numero}" class="form-input" required placeholder="Ex: 101">
          <span th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Andar</label>
          <input type="text" th:field="*{andar}" class="form-input" placeholder="Ex: 1">
        </div>
        <div>
          <label class="form-label">Vaga de Garagem</label>
          <input type="text" th:field="*{vaga}" class="form-input" placeholder="Ex: 05">
        </div>
      </div>

      <div>
        <label class="form-label">Situação <span class="text-red-500">*</span></label>
        <select th:field="*{situacao}" class="form-input" required>
          <option value="">Selecione...</option>
          <option th:each="s : ${T(com.condominio.gestao.enums.SituacaoUnidade).values()}"
                  th:value="${s}" th:text="${s}"></option>
        </select>
        <span th:if="${#fields.hasErrors('situacao')}" th:errors="*{situacao}" class="text-red-600 text-xs mt-1 block"></span>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="btn-primary">Salvar</button>
        <a th:href="@{/unidades}" class="btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>

</div>
</body>
</html>
