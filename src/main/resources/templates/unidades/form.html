<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head><title>Unidade</title></head>
<body>
    <div th:fragment="content">
        <h2 class="text-3xl font-bold mb-6" th:text="${unidade.id == null} ? 'Nova Unidade' : 'Editar Unidade'">Unidade</h2>
        <div class="bg-white shadow-md rounded p-6">
            <form th:action="@{/unidades}" th:object="${unidade}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Bloco *</label>
                    <input type="text" th:field="*{bloco}" class="w-full border rounded px-3 py-2" required>
                    <span th:if="${#fields.hasErrors('bloco')}" th:errors="*{bloco}" class="text-red-600 text-sm"></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Número *</label>
                    <input type="text" th:field="*{numero}" class="w-full border rounded px-3 py-2" required>
                    <span th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}" class="text-red-600 text-sm"></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Andar</label>
                    <input type="text" th:field="*{andar}" class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Vaga de Garagem</label>
                    <input type="text" th:field="*{vaga}" class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Situação *</label>
                    <select th:field="*{situacao}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="s : ${T(com.condominio.gestao.enums.SituacaoUnidade).values()}"
                                th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Salvar</button>
                    <a href="/unidades" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
