<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}"
      lang="pt-BR">
<th:block th:fragment="content">

    <div class="mb-6">
        <nav class="flex items-center gap-2 text-sm text-gray-500 mb-3">
            <a th:href="@{/unidades}" class="hover:text-blue-600">Unidades</a>
            <span>/</span>
            <span class="text-gray-800 font-medium" th:text="${unidade.id == null} ? 'Nova' : 'Editar'">Nova</span>
        </nav>
        <h2 class="text-xl font-bold text-gray-800"
            th:text="${unidade.id == null} ? 'Nova Unidade' : 'Editar Unidade'">Unidade</h2>
    </div>

    <div class="max-w-lg">
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
            <form th:action="@{/unidades}" th:object="${unidade}" method="post" novalidate>
                <input type="hidden" th:field="*{id}"/>

                <div class="space-y-5">

                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label for="bloco" class="block text-sm font-medium text-gray-700 mb-1.5">Bloco *</label>
                            <input id="bloco" type="text" th:field="*{bloco}"
                                   placeholder="Ex: A, B, 1..."
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   required/>
                            <p th:if="${#fields.hasErrors('bloco')}" th:errors="*{bloco}"
                               class="mt-1 text-xs text-red-600"></p>
                        </div>

                        <div>
                            <label for="numero" class="block text-sm font-medium text-gray-700 mb-1.5">Número *</label>
                            <input id="numero" type="text" th:field="*{numero}"
                                   placeholder="Ex: 101, 202..."
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   required/>
                            <p th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"
                               class="mt-1 text-xs text-red-600"></p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label for="andar" class="block text-sm font-medium text-gray-700 mb-1.5">Andar</label>
                            <input id="andar" type="text" th:field="*{andar}"
                                   placeholder="Ex: 1º, 2º..."
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                        </div>

                        <div>
                            <label for="vaga" class="block text-sm font-medium text-gray-700 mb-1.5">Vaga Garagem</label>
                            <input id="vaga" type="text" th:field="*{vaga}"
                                   placeholder="Ex: 10, A-1..."
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                        </div>
                    </div>

                    <div>
                        <label for="situacao" class="block text-sm font-medium text-gray-700 mb-1.5">Situação *</label>
                        <select id="situacao" th:field="*{situacao}"
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                required>
                            <option value="">Selecione...</option>
                            <option th:each="s : ${situacoes}" th:value="${s}" th:text="${s}"></option>
                        </select>
                    </div>

                </div>

                <div class="flex items-center gap-3 mt-7 pt-5 border-t border-gray-100">
                    <button type="submit"
                            class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Salvar Unidade
                    </button>
                    <a th:href="@{/unidades}"
                       class="px-5 py-2.5 bg-white hover:bg-gray-50 text-gray-700 text-sm font-medium rounded-lg border border-gray-300 transition-colors">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>

</th:block>
</html>
