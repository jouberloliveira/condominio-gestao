<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head><title>Dashboard</title></head>
<body>
<div th:fragment="content">

  <!-- Stat Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <div class="card p-6 flex items-center gap-4">
      <div class="bg-indigo-100 text-indigo-600 rounded-xl p-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      </div>
      <div>
        <p class="text-sm text-gray-500 font-medium">Total de Unidades</p>
        <p class="text-2xl font-bold text-gray-800" th:text="${totalUnidades}">0</p>
      </div>
    </div>
    <div class="card p-6 flex items-center gap-4">
      <div class="bg-green-100 text-green-600 rounded-xl p-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </div>
      <div>
        <p class="text-sm text-gray-500 font-medium">Total de Moradores</p>
        <p class="text-2xl font-bold text-gray-800" th:text="${totalMoradores}">0</p>
      </div>
    </div>
    <div class="card p-6 flex items-center gap-4">
      <div class="bg-red-100 text-red-600 rounded-xl p-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      </div>
      <div>
        <p class="text-sm text-gray-500 font-medium">Ocorrências Abertas</p>
        <p class="text-2xl font-bold text-gray-800" th:text="${ocorrenciasAbertas}">0</p>
      </div>
    </div>
    <div class="card p-6 flex items-center gap-4">
      <div class="bg-yellow-100 text-yellow-600 rounded-xl p-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      </div>
      <div>
        <p class="text-sm text-gray-500 font-medium">Visitantes Ativos</p>
        <p class="text-2xl font-bold text-gray-800" th:text="${visitantesAtivos}">0</p>
      </div>
    </div>
  </div>

  <!-- Quick Access -->
  <div class="card p-6 mb-8">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Acesso Rápido</h2>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <a th:href="@{/unidades/new}" class="flex flex-col items-center gap-2 p-4 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 transition font-medium text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Nova Unidade
      </a>
      <a th:href="@{/moradores/new}" class="flex flex-col items-center gap-2 p-4 rounded-xl bg-green-50 hover:bg-green-100 text-green-700 transition font-medium text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Novo Morador
      </a>
      <a th:href="@{/visitantes/new}" class="flex flex-col items-center gap-2 p-4 rounded-xl bg-yellow-50 hover:bg-yellow-100 text-yellow-700 transition font-medium text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Novo Visitante
      </a>
      <a th:href="@{/ocorrencias/new}" class="flex flex-col items-center gap-2 p-4 rounded-xl bg-red-50 hover:bg-red-100 text-red-700 transition font-medium text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Nova Ocorrência
      </a>
    </div>
  </div>

  <!-- Reservas do Dia -->
  <div class="card p-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Reservas de Hoje</h2>
    <div th:if="${#lists.isEmpty(reservasHoje)}" class="text-center py-8 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <p class="text-sm">Nenhuma reserva para hoje</p>
    </div>
    <ul th:unless="${#lists.isEmpty(reservasHoje)}" class="divide-y divide-gray-100">
      <li th:each="r : ${reservasHoje}" class="flex items-center justify-between py-3">
        <div>
          <p class="font-medium text-gray-800" th:text="${r.area}">Área</p>
          <p class="text-sm text-gray-500" th:text="${r.solicitante?.nome}">Solicitante</p>
        </div>
        <span th:text="${r.status}"
              th:class="${r.status?.name() == 'CONFIRMADA'} ? 'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700' :
                        (${r.status?.name() == 'SOLICITADA'} ? 'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700' :
                        (${r.status?.name() == 'CANCELADA'} ? 'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-700' :
                        'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-700'))">
        </span>
      </li>
    </ul>
  </div>

</div>
</body>
</html>
