<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<head><title>Reserva</title></head>
<body>
    <div th:fragment="content">
        <h2 class="text-3xl font-bold mb-6" th:text="${reserva.id == null} ? 'Nova Reserva' : 'Editar Reserva'">Reserva</h2>
        <div class="bg-white shadow-md rounded p-6">
            <form th:action="@{/reservas}" th:object="${reserva}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Unidade *</label>
                    <select th:field="*{unidade}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.identificacao}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Solicitante *</label>
                    <select th:field="*{solicitante}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="m : ${moradores}" th:value="${m.id}" th:text="${m.nome + ' - ' + m.unidade.identificacao}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Área *</label>
                    <select th:field="*{area}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="a : ${T(com.condominio.gestao.enums.AreaReserva).values()}"
                                th:value="${a}" th:text="${a}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Início *</label>
                    <input type="datetime-local" th:field="*{inicio}" class="w-full border rounded px-3 py-2" required>
                    <span th:if="${#fields.hasErrors('inicio')}" th:errors="*{inicio}" class="text-red-600 text-sm"></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Fim *</label>
                    <input type="datetime-local" th:field="*{fim}" class="w-full border rounded px-3 py-2" required>
                    <span th:if="${#fields.hasErrors('fim')}" th:errors="*{fim}" class="text-red-600 text-sm"></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Status *</label>
                    <select th:field="*{status}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="s : ${T(com.condominio.gestao.enums.StatusReserva).values()}"
                                th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Observação</label>
                    <textarea th:field="*{observacao}" class="w-full border rounded px-3 py-2" rows="3"></textarea>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Salvar</button>
                    <a href="/reservas" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
