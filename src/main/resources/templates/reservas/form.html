<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head><title>Reserva</title></head>
<body>
<div th:fragment="content">

  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800" th:text="${reserva.id == null} ? 'Nova Reserva' : 'Editar Reserva'">Reserva</h1>
  </div>

  <div class="card p-6 max-w-2xl">
    <form th:action="@{/reservas}" th:object="${reserva}" method="post" class="space-y-5">
      <input type="hidden" th:field="*{id}">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="form-label">Unidade <span class="text-red-500">*</span></label>
          <select th:field="*{unidade}" class="form-input" required>
            <option value="">Selecione...</option>
            <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.identificacao}"></option>
          </select>
          <span th:if="${#fields.hasErrors('unidade')}" th:errors="*{unidade}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Solicitante <span class="text-red-500">*</span></label>
          <select th:field="*{solicitante}" class="form-input" required>
            <option value="">Selecione...</option>
            <option th:each="m : ${moradores}" th:value="${m.id}" th:text="${m.nome + ' - ' + m.unidade?.identificacao}"></option>
          </select>
          <span th:if="${#fields.hasErrors('solicitante')}" th:errors="*{solicitante}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Área <span class="text-red-500">*</span></label>
          <select th:field="*{area}" class="form-input" required>
            <option value="">Selecione...</option>
            <option th:each="a : ${T(com.condominio.gestao.enums.AreaReserva).values()}"
                    th:value="${a}" th:text="${a}"></option>
          </select>
          <span th:if="${#fields.hasErrors('area')}" th:errors="*{area}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Status <span class="text-red-500">*</span></label>
          <select th:field="*{status}" class="form-input" required>
            <option value="">Selecione...</option>
            <option th:each="s : ${T(com.condominio.gestao.enums.StatusReserva).values()}"
                    th:value="${s}" th:text="${s}"></option>
          </select>
          <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Início <span class="text-red-500">*</span></label>
          <input type="datetime-local" th:field="*{inicio}" class="form-input" required>
          <span th:if="${#fields.hasErrors('inicio')}" th:errors="*{inicio}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Fim <span class="text-red-500">*</span></label>
          <input type="datetime-local" th:field="*{fim}" class="form-input" required>
          <span th:if="${#fields.hasErrors('fim')}" th:errors="*{fim}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
      </div>

      <div>
        <label class="form-label">Observação</label>
        <textarea th:field="*{observacao}" class="form-input" rows="3" placeholder="Informações adicionais..."></textarea>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="btn-primary">Salvar</button>
        <a th:href="@{/reservas}" class="btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>

</div>
</body>
</html>
