<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}"
      lang="pt-BR">
<th:block th:fragment="content">

    <div class="mb-6">
        <nav class="flex items-center gap-2 text-sm text-gray-500 mb-3">
            <a th:href="@{/reservas}" class="hover:text-blue-600">Reservas</a>
            <span>/</span>
            <span class="text-gray-800 font-medium" th:text="${reserva.id == null} ? 'Nova' : 'Editar'">Nova</span>
        </nav>
        <h2 class="text-xl font-bold text-gray-800"
            th:text="${reserva.id == null} ? 'Nova Reserva' : 'Editar Reserva'">Reserva</h2>
    </div>

    <div class="max-w-2xl">
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
            <form th:action="@{/reservas}" th:object="${reserva}" method="post" novalidate>
                <input type="hidden" th:field="*{id}"/>

                <div class="space-y-5">

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="unidade" class="block text-sm font-medium text-gray-700 mb-1.5">Unidade *</label>
                            <select id="unidade" th:field="*{unidade}"
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required>
                                <option value="">Selecione a unidade...</option>
                                <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.identificacao}"
                                        th:selected="${reserva.unidade != null and reserva.unidade.id == u.id}"></option>
                            </select>
                        </div>

                        <div>
                            <label for="solicitante" class="block text-sm font-medium text-gray-700 mb-1.5">Solicitante *</label>
                            <select id="solicitante" th:field="*{solicitante}"
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required>
                                <option value="">Selecione o solicitante...</option>
                                <option th:each="m : ${moradores}" th:value="${m.id}"
                                        th:text="${m.nome + ' (' + m.unidade?.identificacao + ')'}"
                                        th:selected="${reserva.solicitante != null and reserva.solicitante.id == m.id}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="area" class="block text-sm font-medium text-gray-700 mb-1.5">Área *</label>
                            <select id="area" th:field="*{area}"
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required>
                                <option value="">Selecione a área...</option>
                                <option th:each="a : ${areas}" th:value="${a}" th:text="${a}"></option>
                            </select>
                        </div>

                        <div>
                            <label for="status" class="block text-sm font-medium text-gray-700 mb-1.5">Status *</label>
                            <select id="status" th:field="*{status}"
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required>
                                <option value="">Selecione...</option>
                                <option th:each="s : ${statusList}" th:value="${s}" th:text="${s}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="inicio" class="block text-sm font-medium text-gray-700 mb-1.5">Início *</label>
                            <input id="inicio" type="datetime-local" th:field="*{inicio}"
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   required/>
                            <p th:if="${#fields.hasErrors('inicio')}" th:errors="*{inicio}"
                               class="mt-1 text-xs text-red-600"></p>
                        </div>

                        <div>
                            <label for="fim" class="block text-sm font-medium text-gray-700 mb-1.5">Fim *</label>
                            <input id="fim" type="datetime-local" th:field="*{fim}"
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   required/>
                            <p th:if="${#fields.hasErrors('fim')}" th:errors="*{fim}"
                               class="mt-1 text-xs text-red-600"></p>
                        </div>
                    </div>

                    <div>
                        <label for="observacao" class="block text-sm font-medium text-gray-700 mb-1.5">Observações</label>
                        <textarea id="observacao" th:field="*{observacao}" rows="3"
                                  placeholder="Informações adicionais sobre a reserva..."
                                  class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-y"></textarea>
                    </div>

                </div>

                <div class="flex items-center gap-3 mt-7 pt-5 border-t border-gray-100">
                    <button type="submit"
                            class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Salvar Reserva
                    </button>
                    <a th:href="@{/reservas}"
                       class="px-5 py-2.5 bg-white hover:bg-gray-50 text-gray-700 text-sm font-medium rounded-lg border border-gray-300 transition-colors">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>

        <div class="mt-4 bg-blue-50 border border-blue-100 rounded-xl p-4 flex items-start gap-3">
            <svg class="w-5 h-5 text-blue-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p class="text-sm text-blue-700">
                Dica: verifique as reservas existentes antes de confirmar para evitar conflitos de horário.
            </p>
        </div>
    </div>

    <script>
        document.getElementById('inicio').addEventListener('change', function() {
            const fimInput = document.getElementById('fim');
            if (!fimInput.value || fimInput.value < this.value) {
                fimInput.value = this.value;
            }
            fimInput.min = this.value;
        });
    </script>

</th:block>
</html>
