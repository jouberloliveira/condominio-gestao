<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::content})}"
      lang="pt-BR">
<th:block th:fragment="content">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
            <h2 class="text-xl font-bold text-gray-800">Reservas de Áreas Comuns</h2>
            <p class="text-sm text-gray-500 mt-0.5">Gerencie as reservas das áreas do condomínio</p>
        </div>
        <div class="flex items-center gap-3">
            <a th:href="@{/reservas/calendario}"
               class="inline-flex items-center gap-2 px-4 py-2.5 bg-white hover:bg-gray-50 text-gray-700 text-sm font-medium rounded-lg border border-gray-300 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                Calendário
            </a>
            <a th:href="@{/reservas/new}"
               class="inline-flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Nova Reserva
            </a>
        </div>
    </div>

    <!-- Filter -->
    <div class="flex flex-wrap gap-3 mb-4">
        <input id="search" type="text" placeholder="Buscar reserva..."
               oninput="filterTable()"
               class="w-full sm:w-64 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <select id="filterStatus" onchange="filterTable()"
                class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Todos os status</option>
            <option value="SOLICITADA">Solicitada</option>
            <option value="APROVADA">Aprovada</option>
            <option value="CANCELADA">Cancelada</option>
            <option value="REALIZADA">Realizada</option>
        </select>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-100" id="reservas-table">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Área</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Solicitante</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Unidade</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Início</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Fim</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Ações</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:if="${#lists.isEmpty(reservas)}">
                        <td colspan="7" class="px-6 py-12 text-center text-sm text-gray-400">
                            Nenhuma reserva cadastrada.
                        </td>
                    </tr>
                    <tr th:each="reserva : ${reservas}" class="hover:bg-gray-50 transition-colors"
                        th:attr="data-status=${reserva.status}">
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-lg bg-yellow-100 flex items-center justify-center flex-shrink-0">
                                    <svg class="w-4 h-4 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                    </svg>
                                </div>
                                <span class="text-sm font-medium text-gray-800" th:text="${reserva.area}">—</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${reserva.solicitante?.nome} ?: '—'">—</td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-700"
                                  th:text="${reserva.unidade?.identificacao} ?: '—'">—</span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-600"
                            th:text="${#temporals.format(reserva.inicio, 'dd/MM/yyyy HH:mm')}">—</td>
                        <td class="px-6 py-4 text-sm text-gray-600"
                            th:text="${#temporals.format(reserva.fim, 'dd/MM/yyyy HH:mm')}">—</td>
                        <td class="px-6 py-4">
                            <span th:class="${reserva.status?.name() == 'APROVADA'} ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800' :
                                            (${reserva.status?.name() == 'SOLICITADA'} ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800' :
                                            (${reserva.status?.name() == 'REALIZADA'} ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-700' :
                                            'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800'))"
                                  th:text="${reserva.status}">—</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <a th:href="@{/reservas/{id}/edit(id=${reserva.id})}"
                                   class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors">
                                    Editar
                                </a>
                                <a th:href="@{/reservas/{id}/delete(id=${reserva.id})}"
                                   sec:authorize="hasRole('ADMIN')"
                                   onclick="return confirm('Deseja excluir esta reserva?')"
                                   class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-red-700 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">
                                    Excluir
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="px-6 py-3 bg-gray-50 border-t border-gray-100 text-xs text-gray-500"
             th:text="${#lists.size(reservas)} + ' reserva(s) cadastrada(s)'"></div>
    </div>

    <script>
        function filterTable() {
            const q = document.getElementById('search').value.toLowerCase();
            const status = document.getElementById('filterStatus').value;
            document.querySelectorAll('#reservas-table tbody tr[class]').forEach(row => {
                const matchText = row.textContent.toLowerCase().includes(q);
                const matchStatus = !status || row.dataset.status === status;
                row.style.display = (matchText && matchStatus) ? '' : 'none';
            });
        }
    </script>

</th:block>
</html>
