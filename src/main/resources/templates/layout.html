<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'CondoGest — Gestão de Condomínio'">CondoGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#4F46E5', 50: '#EEF2FF', 100: '#E0E7FF', 500: '#6366F1', 600: '#4F46E5', 700: '#4338CA' },
                        sidebar: '#1E1B4B'
                    }
                }
            }
        }
    </script>
    <style>
        .nav-link { @apply flex items-center gap-3 px-4 py-2.5 rounded-lg text-indigo-200 hover:bg-indigo-700 hover:text-white transition-all duration-150 text-sm font-medium; }
        .nav-link.active { @apply bg-indigo-700 text-white; }
        .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
        .btn-primary { @apply inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2; }
        .btn-secondary { @apply inline-flex items-center gap-2 bg-white hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-lg border border-gray-300 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2; }
        .btn-danger { @apply inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2; }
        .card { @apply bg-white rounded-2xl shadow-sm border border-gray-100; }
        .form-input { @apply mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2 border; }
        .form-label { @apply block text-sm font-medium text-gray-700 mb-1; }
        .table-th { @apply px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider; }
        .table-td { @apply px-5 py-4 text-sm text-gray-700; }
        .sidebar-section { @apply text-xs font-semibold text-indigo-400 uppercase tracking-widest px-4 pt-4 pb-1; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex">

<!-- Sidebar -->
<aside id="sidebar" class="w-64 bg-[#1E1B4B] flex flex-col min-h-screen fixed top-0 left-0 z-30 shadow-xl">
    <!-- Logo -->
    <div class="flex items-center gap-3 px-5 py-5 border-b border-indigo-800">
        <div class="w-9 h-9 bg-indigo-500 rounded-xl flex items-center justify-center text-white font-bold text-lg">C</div>
        <div>
            <p class="text-white font-bold text-base leading-tight">CondoGest</p>
            <p class="text-indigo-300 text-xs">Gestão de Condomínio</p>
        </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
        <p class="sidebar-section">Principal</p>
        <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'active'" class="nav-link">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Dashboard
        </a>

        <p class="sidebar-section mt-2">Cadastros</p>
        <a th:href="@{/unidades}" th:classappend="${activePage == 'unidades'} ? 'active'" class="nav-link">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            Unidades
        </a>
        <a th:href="@{/moradores}" th:classappend="${activePage == 'moradores'} ? 'active'" class="nav-link">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            Moradores
        </a>
        <a th:href="@{/visitantes}" th:classappend="${activePage == 'visitantes'} ? 'active'" class="nav-link">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Visitantes
        </a>

        <p class="sidebar-section mt-2">Operações</p>
        <a th:href="@{/reservas}" th:classappend="${activePage == 'reservas'} ? 'active'" class="nav-link">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            Reservas
        </a>
        <a th:href="@{/ocorrencias}" th:classappend="${activePage == 'ocorrencias'} ? 'active'" class="nav-link">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.924-.833-2.694 0L3.196 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
            Ocorrências
        </a>
    </nav>

    <!-- User footer -->
    <div class="px-4 py-4 border-t border-indigo-800">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center text-white text-sm font-bold">A</div>
            <div class="flex-1 min-w-0">
                <p class="text-white text-sm font-medium truncate">Administrador</p>
                <p class="text-indigo-300 text-xs">Admin</p>
            </div>
        </div>
    </div>
</aside>

<!-- Main content -->
<div class="flex-1 ml-64 flex flex-col min-h-screen">
    <!-- Top bar -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
        <div>
            <h1 class="text-lg font-semibold text-gray-900" th:text="${title} ?: 'Dashboard'">Dashboard</h1>
            <p class="text-xs text-gray-500" th:text="${subtitle} ?: ''"></p>
        </div>
        <div class="flex items-center gap-3">
            <div th:if="${success}" class="flex items-center gap-2 bg-green-50 text-green-700 text-sm px-3 py-1.5 rounded-lg border border-green-200">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="flex items-center gap-2 bg-red-50 text-red-700 text-sm px-3 py-1.5 rounded-lg border border-red-200">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
                <span th:text="${error}"></span>
            </div>
        </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 p-6">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="px-6 py-3 border-t border-gray-100 text-xs text-gray-400 text-center">
        CondoGest &copy; 2025 — Sistema de Gestão de Condomínio
    </footer>
</div>

</body>
</html>
