<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Gestão de Condomínio'">Gestão de Condomínio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Gestão de Condomínio</h1>
            <div class="space-x-4">
                <a th:href="@{/}" class="hover:underline">Home</a>
                <a th:href="@{/unidades}" class="hover:underline">Unidades</a>
                <a th:href="@{/moradores}" class="hover:underline">Moradores</a>
                <a th:href="@{/visitantes}" class="hover:underline">Visitantes</a>
                <a th:href="@{/reservas}" class="hover:underline">Reservas</a>
                <a th:href="@{/ocorrencias}" class="hover:underline">Ocorrências</a>
            </div>
        </div>
    </nav>
    
    <div class="container mx-auto mt-6 p-4">
        <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <span th:text="${error}"></span>
        </div>
        
        <div th:replace="${content}"></div>
    </div>
</body>
</html>
