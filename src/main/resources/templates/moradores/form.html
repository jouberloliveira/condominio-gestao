<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head><title>Morador</title></head>
<body>
<div th:fragment="content">

  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800" th:text="${morador.id == null} ? 'Novo Morador' : 'Editar Morador'">Morador</h1>
  </div>

  <div class="card p-6 max-w-2xl">
    <form th:action="@{/moradores}" th:object="${morador}" method="post" class="space-y-5">
      <input type="hidden" th:field="*{id}">

      <div>
        <label class="form-label">Unidade <span class="text-red-500">*</span></label>
        <select th:field="*{unidade}" class="form-input" required>
          <option value="">Selecione...</option>
          <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.identificacao}"></option>
        </select>
        <span th:if="${#fields.hasErrors('unidade')}" th:errors="*{unidade}" class="text-red-600 text-xs mt-1 block"></span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="form-label">Nome <span class="text-red-500">*</span></label>
          <input type="text" th:field="*{nome}" class="form-input" required placeholder="Nome completo">
          <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">CPF <span class="text-red-500">*</span></label>
          <input type="text" th:field="*{cpf}" class="form-input" required maxlength="14"
                 placeholder="000.000.000-00" oninput="maskCpf(this)">
          <span th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Telefone</label>
          <input type="text" th:field="*{telefone}" class="form-input" maxlength="15"
                 placeholder="(00) 00000-0000" oninput="maskTelefone(this)">
        </div>
        <div>
          <label class="form-label">Email</label>
          <input type="email" th:field="*{email}" class="form-input" placeholder="email@exemplo.com">
          <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Tipo de Morador <span class="text-red-500">*</span></label>
          <select th:field="*{tipoMorador}" class="form-input" required>
            <option value="">Selecione...</option>
            <option th:each="t : ${T(com.condominio.gestao.enums.TipoMorador).values()}"
                    th:value="${t}" th:text="${t}"></option>
          </select>
          <span th:if="${#fields.hasErrors('tipoMorador')}" th:errors="*{tipoMorador}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Responsável pela Unidade <span class="text-red-500">*</span></label>
          <select th:field="*{responsavelUnidade}" class="form-input" required>
            <option value="">Selecione...</option>
            <option th:each="r : ${T(com.condominio.gestao.enums.SimNao).values()}"
                    th:value="${r}" th:text="${r}"></option>
          </select>
          <span th:if="${#fields.hasErrors('responsavelUnidade')}" th:errors="*{responsavelUnidade}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="btn-primary">Salvar</button>
        <a th:href="@{/moradores}" class="btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>

  <script>
    function maskCpf(input) {
      let v = input.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9) v = v.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/^(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
      else if (v.length > 3) v = v.replace(/^(\d{3})(\d{0,3})/, '$1.$2');
      input.value = v;
    }
    function maskTelefone(input) {
      let v = input.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
      else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
      else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
      else if (v.length > 0) v = v.replace(/^(\d{0,2})/, '($1');
      input.value = v;
    }
  </script>

</div>
</body>
</html>
