<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<head><title>Morador</title></head>
<body>
    <div th:fragment="content">
        <h2 class="text-3xl font-bold mb-6" th:text="${morador.id == null} ? 'Novo Morador' : 'Editar Morador'">Morador</h2>
        <div class="bg-white shadow-md rounded p-6">
            <form th:action="@{/moradores}" th:object="${morador}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Unidade *</label>
                    <select th:field="*{unidade}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.identificacao}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Nome *</label>
                    <input type="text" th:field="*{nome}" class="w-full border rounded px-3 py-2" required>
                    <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-red-600 text-sm"></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">CPF *</label>
                    <input type="text" th:field="*{cpf}" class="w-full border rounded px-3 py-2" required maxlength="14">
                    <span th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="text-red-600 text-sm"></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Telefone</label>
                    <input type="text" th:field="*{telefone}" class="w-full border rounded px-3 py-2" maxlength="15">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Email</label>
                    <input type="email" th:field="*{email}" class="w-full border rounded px-3 py-2">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-sm"></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Tipo Morador *</label>
                    <select th:field="*{tipoMorador}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="t : ${T(com.condominio.gestao.enums.TipoMorador).values()}"
                                th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Responsável pela Unidade *</label>
                    <select th:field="*{responsavelUnidade}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="r : ${T(com.condominio.gestao.enums.SimNao).values()}"
                                th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Salvar</button>
                    <a href="/moradores" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
