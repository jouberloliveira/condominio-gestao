<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head><title>Moradores</title></head>
<body>
<div th:fragment="content">

  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Moradores</h1>
    <a th:href="@{/moradores/new}" class="btn-primary">+ Novo Morador</a>
  </div>

  <div class="card p-0 overflow-hidden">
    <div th:if="${#lists.isEmpty(moradores)}" class="text-center py-16 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <p class="text-sm">Nenhum morador cadastrado</p>
    </div>
    <div th:unless="${#lists.isEmpty(moradores)}" class="overflow-x-auto">
      <table class="min-w-full">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="table-th">Nome</th>
            <th class="table-th">CPF</th>
            <th class="table-th">Email</th>
            <th class="table-th">Telefone</th>
            <th class="table-th">Unidade</th>
            <th class="table-th">Tipo</th>
            <th class="table-th">Responsável</th>
            <th class="table-th">Ações</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr th:each="morador : ${moradores}" class="hover:bg-gray-50 transition">
            <td class="table-td font-medium text-gray-800" th:text="${morador.nome}"></td>
            <td class="table-td" th:text="${morador.cpf}"></td>
            <td class="table-td" th:text="${morador.email}"></td>
            <td class="table-td" th:text="${morador.telefone}"></td>
            <td class="table-td" th:text="${morador.unidade?.identificacao}"></td>
            <td class="table-td">
              <span th:text="${morador.tipoMorador}"
                    th:class="${morador.tipoMorador?.name() == 'PROPRIETARIO'} ? 'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-700' :
                              (${morador.tipoMorador?.name() == 'INQUILINO'} ? 'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-purple-100 text-purple-700' :
                              'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-600')">
              </span>
            </td>
            <td class="table-td">
              <span th:text="${morador.responsavelUnidade}"
                    th:class="${morador.responsavelUnidade?.name() == 'SIM'} ? 'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700' :
                              'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-600'">
              </span>
            </td>
            <td class="table-td">
              <div class="flex items-center gap-3">
                <a th:href="@{/moradores/edit/{id}(id=${morador.id})}" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium">Editar</a>
                <a th:href="@{/moradores/delete/{id}(id=${morador.id})}" class="btn-danger text-xs py-1 px-2"
                   onclick="return confirm('Confirma a exclusão?')">Excluir</a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
