<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<head><title>Ocorrência</title></head>
<body>
    <div th:fragment="content">
        <h2 class="text-3xl font-bold mb-6" th:text="${ocorrencia.id == null} ? 'Nova Ocorrência' : 'Editar Ocorrência'">Ocorrência</h2>
        <div class="bg-white shadow-md rounded p-6">
            <form th:action="@{/ocorrencias}" th:object="${ocorrencia}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Unidade</label>
                    <select th:field="*{unidade}" class="w-full border rounded px-3 py-2">
                        <option value="">Nenhuma</option>
                        <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.identificacao}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Aberto Por</label>
                    <select th:field="*{abertoPor}" class="w-full border rounded px-3 py-2">
                        <option value="">Nenhum</option>
                        <option th:each="m : ${moradores}" th:value="${m.id}" th:text="${m.nome + ' - ' + m.unidade.identificacao}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Tipo *</label>
                    <select th:field="*{tipo}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="t : ${T(com.condominio.gestao.enums.TipoOcorrencia).values()}"
                                th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Prioridade *</label>
                    <select th:field="*{prioridade}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="p : ${T(com.condominio.gestao.enums.PrioridadeOcorrencia).values()}"
                                th:value="${p}" th:text="${p}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Status *</label>
                    <select th:field="*{status}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="s : ${T(com.condominio.gestao.enums.StatusOcorrencia).values()}"
                                th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Título *</label>
                    <input type="text" th:field="*{titulo}" class="w-full border rounded px-3 py-2" required>
                    <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" class="text-red-600 text-sm"></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Descrição</label>
                    <textarea th:field="*{descricao}" class="w-full border rounded px-3 py-2" rows="4"></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Data/Hora Abertura *</label>
                    <input type="datetime-local" th:field="*{dataHoraAbertura}" class="w-full border rounded px-3 py-2" required>
                    <span th:if="${#fields.hasErrors('dataHoraAbertura')}" th:errors="*{dataHoraAbertura}" class="text-red-600 text-sm"></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Data/Hora Fechamento</label>
                    <input type="datetime-local" th:field="*{dataHoraFechamento}" class="w-full border rounded px-3 py-2">
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Salvar</button>
                    <a href="/ocorrencias" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
