<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head><title>Ocorrencia</title></head>
<body>
<div th:fragment="content">

  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800" th:text="${ocorrencia.id == null} ? 'Nova Ocorrência' : 'Editar Ocorrência'">Ocorrência</h1>
  </div>

  <div class="card p-6 max-w-2xl">
    <form th:action="@{/ocorrencias}" th:object="${ocorrencia}" method="post" class="space-y-5">
      <input type="hidden" th:field="*{id}">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="form-label">Unidade</label>
          <select th:field="*{unidade}" class="form-input">
            <option value="">Nenhuma</option>
            <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.identificacao}"></option>
          </select>
        </div>
        <div>
          <label class="form-label">Aberto Por</label>
          <select th:field="*{abertoPor}" class="form-input">
            <option value="">Nenhum</option>
            <option th:each="m : ${moradores}" th:value="${m.id}" th:text="${m.nome + ' - ' + m.unidade?.identificacao}"></option>
          </select>
        </div>
        <div>
          <label class="form-label">Tipo <span class="text-red-500">*</span></label>
          <select th:field="*{tipo}" class="form-input" required>
            <option value="">Selecione...</option>
            <option th:each="t : ${T(com.condominio.gestao.enums.TipoOcorrencia).values()}"
                    th:value="${t}" th:text="${t}"></option>
          </select>
          <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Prioridade <span class="text-red-500">*</span></label>
          <select th:field="*{prioridade}" class="form-input" required>
            <option value="">Selecione...</option>
            <option th:each="p : ${T(com.condominio.gestao.enums.PrioridadeOcorrencia).values()}"
                    th:value="${p}" th:text="${p}"></option>
          </select>
          <span th:if="${#fields.hasErrors('prioridade')}" th:errors="*{prioridade}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Status <span class="text-red-500">*</span></label>
          <select th:field="*{status}" class="form-input" required>
            <option value="">Selecione...</option>
            <option th:each="s : ${T(com.condominio.gestao.enums.StatusOcorrencia).values()}"
                    th:value="${s}" th:text="${s}"></option>
          </select>
          <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
      </div>

      <div>
        <label class="form-label">Título <span class="text-red-500">*</span></label>
        <input type="text" th:field="*{titulo}" class="form-input" required placeholder="Descreva brevemente o problema">
        <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" class="text-red-600 text-xs mt-1 block"></span>
      </div>

      <div>
        <label class="form-label">Descrição <span class="text-red-500">*</span></label>
        <textarea th:field="*{descricao}" class="form-input" rows="4" required placeholder="Detalhes da ocorrência..."></textarea>
        <span th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="text-red-600 text-xs mt-1 block"></span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="form-label">Data/Hora Abertura <span class="text-red-500">*</span></label>
          <input type="datetime-local" th:field="*{dataHoraAbertura}" class="form-input" required>
          <span th:if="${#fields.hasErrors('dataHoraAbertura')}" th:errors="*{dataHoraAbertura}" class="text-red-600 text-xs mt-1 block"></span>
        </div>
        <div>
          <label class="form-label">Data/Hora Fechamento</label>
          <input type="datetime-local" th:field="*{dataHoraFechamento}" class="form-input">
        </div>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="btn-primary">Salvar</button>
        <a th:href="@{/ocorrencias}" class="btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>

</div>
</body>
</html>
