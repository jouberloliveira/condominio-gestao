<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<head><title>Visitante</title></head>
<body>
    <div th:fragment="content">
        <h2 class="text-3xl font-bold mb-6" th:text="${visitante.id == null} ? 'Novo Visitante' : 'Editar Visitante'">Visitante</h2>
        <div class="bg-white shadow-md rounded p-6">
            <form th:action="@{/visitantes}" th:object="${visitante}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Unidade *</label>
                    <select th:field="*{unidade}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.identificacao}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Nome *</label>
                    <input type="text" th:field="*{nome}" class="w-full border rounded px-3 py-2" required>
                    <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-red-600 text-sm"></span>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Documento</label>
                    <input type="text" th:field="*{documento}" class="w-full border rounded px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Telefone</label>
                    <input type="text" th:field="*{telefone}" class="w-full border rounded px-3 py-2" maxlength="15">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Tipo Visitante *</label>
                    <select th:field="*{tipoVisitante}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="t : ${T(com.condominio.gestao.enums.TipoVisitante).values()}"
                                th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Autorizado Por</label>
                    <select th:field="*{autorizadoPor}" class="w-full border rounded px-3 py-2">
                        <option value="">Nenhum</option>
                        <option th:each="m : ${moradores}" th:value="${m.id}" th:text="${m.nome + ' - ' + m.unidade.identificacao}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2">Ativo *</label>
                    <select th:field="*{ativo}" class="w-full border rounded px-3 py-2" required>
                        <option value="">Selecione...</option>
                        <option th:each="a : ${T(com.condominio.gestao.enums.SimNao).values()}"
                                th:value="${a}" th:text="${a}"></option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Salvar</button>
                    <a href="/visitantes" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
