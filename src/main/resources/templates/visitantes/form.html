<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}"
      lang="pt-BR">
<th:block th:fragment="content">

    <div class="mb-6">
        <nav class="flex items-center gap-2 text-sm text-gray-500 mb-3">
            <a th:href="@{/visitantes}" class="hover:text-blue-600">Visitantes</a>
            <span>/</span>
            <span class="text-gray-800 font-medium" th:text="${visitante.id == null} ? 'Novo' : 'Editar'">Novo</span>
        </nav>
        <h2 class="text-xl font-bold text-gray-800"
            th:text="${visitante.id == null} ? 'Registrar Visitante' : 'Editar Visitante'">Visitante</h2>
    </div>

    <div class="max-w-2xl">
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
            <form th:action="@{/visitantes}" th:object="${visitante}" method="post" novalidate>
                <input type="hidden" th:field="*{id}"/>

                <div class="space-y-5">

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="nome" class="block text-sm font-medium text-gray-700 mb-1.5">Nome completo *</label>
                            <input id="nome" type="text" th:field="*{nome}"
                                   placeholder="Nome do visitante"
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                   required/>
                            <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"
                               class="mt-1 text-xs text-red-600"></p>
                        </div>

                        <div>
                            <label for="documento" class="block text-sm font-medium text-gray-700 mb-1.5">RG / CPF / Documento</label>
                            <input id="documento" type="text" th:field="*{documento}"
                                   placeholder="Número do documento"
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="telefone" class="block text-sm font-medium text-gray-700 mb-1.5">Telefone</label>
                            <input id="telefone" type="text" th:field="*{telefone}"
                                   placeholder="(00) 00000-0000"
                                   maxlength="15"
                                   oninput="maskTelefone(this)"
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                        </div>

                        <div>
                            <label for="placa" class="block text-sm font-medium text-gray-700 mb-1.5">Placa do Veículo</label>
                            <input id="placa" type="text" th:field="*{placa}"
                                   placeholder="ABC-1234"
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="tipoVisitante" class="block text-sm font-medium text-gray-700 mb-1.5">Tipo *</label>
                            <select id="tipoVisitante" th:field="*{tipoVisitante}"
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required>
                                <option value="">Selecione...</option>
                                <option th:each="t : ${tiposVisitante}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>

                        <div>
                            <label for="ativo" class="block text-sm font-medium text-gray-700 mb-1.5">Status *</label>
                            <select id="ativo" th:field="*{ativo}"
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required>
                                <option value="">Selecione...</option>
                                <option th:each="s : ${simNaoList}" th:value="${s}" th:text="${s == 'SIM'} ? 'Ativo' : 'Inativo'"></option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="unidade" class="block text-sm font-medium text-gray-700 mb-1.5">Unidade Visitada *</label>
                            <select id="unidade" th:field="*{unidade}"
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required>
                                <option value="">Selecione a unidade...</option>
                                <option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.identificacao}"
                                        th:selected="${visitante.unidade != null and visitante.unidade.id == u.id}"></option>
                            </select>
                        </div>

                        <div>
                            <label for="autorizadoPor" class="block text-sm font-medium text-gray-700 mb-1.5">Autorizado Por</label>
                            <select id="autorizadoPor" th:field="*{autorizadoPor}"
                                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">Nenhum</option>
                                <option th:each="m : ${moradores}" th:value="${m.id}"
                                        th:text="${m.nome + ' (' + m.unidade?.identificacao + ')'}"
                                        th:selected="${visitante.autorizadoPor != null and visitante.autorizadoPor.id == m.id}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="dataHoraEntrada" class="block text-sm font-medium text-gray-700 mb-1.5">Entrada</label>
                            <input id="dataHoraEntrada" type="datetime-local" th:field="*{dataHoraEntrada}"
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                        </div>

                        <div>
                            <label for="dataHoraSaida" class="block text-sm font-medium text-gray-700 mb-1.5">Saída</label>
                            <input id="dataHoraSaida" type="datetime-local" th:field="*{dataHoraSaida}"
                                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                        </div>
                    </div>

                    <div>
                        <label for="observacao" class="block text-sm font-medium text-gray-700 mb-1.5">Observações</label>
                        <textarea id="observacao" th:field="*{observacao}" rows="2"
                                  placeholder="Observações sobre a visita..."
                                  class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-y"></textarea>
                    </div>

                </div>

                <div class="flex items-center gap-3 mt-7 pt-5 border-t border-gray-100">
                    <button type="submit"
                            class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Salvar Visitante
                    </button>
                    <a th:href="@{/visitantes}"
                       class="px-5 py-2.5 bg-white hover:bg-gray-50 text-gray-700 text-sm font-medium rounded-lg border border-gray-300 transition-colors">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function maskTelefone(input) {
            let v = input.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
            else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
            else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
            else if (v.length > 0) v = '(' + v;
            input.value = v;
        }
    </script>

</th:block>
</html>
