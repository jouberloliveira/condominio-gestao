version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: condominio-postgres
    environment:
      POSTGRES_DB: condominio
      POSTGRES_USER: condominio
      POSTGRES_PASSWORD: condominio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condominio"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: condominio-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: condominio
      DB_USER: condominio
      DB_PASS: condominio
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
